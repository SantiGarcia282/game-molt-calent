<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Molt Calent</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #f43f5e;
    --text: #f8fafc;
    --border: #334155;
    --selected: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hidden { display: none !important; }
  .screen { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 16px; }

  h1 { color: var(--accent); font-size: 2rem; text-align: center; margin-top: 10px; }
  p.subtitle { color: #94a3b8; font-size: 0.95rem; text-align: center; margin-bottom: 8px; }

  /* Grid de Avatares con Fotos */
  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    background: var(--card);
    padding: 16px;
    border-radius: 16px;
    border: 1px solid var(--border);
  }
  .avatar-card {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .avatar-card.selected {
    border-color: var(--selected);
    background: rgba(16, 185, 129, 0.15);
  }
  .player-photo { 
    width: 60px; 
    height: 60px; 
    border-radius: 50%; 
    object-fit: cover;
    border: 2px solid var(--border);
  }
  .avatar-card.selected .player-photo { border-color: var(--selected); }
  .avatar-card .name { font-size: 0.85rem; font-weight: bold; color: #cbd5e1; }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: bold;
    width: 100%;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }

  /* Tablero Ampliado */
  .game-header { width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px; border-radius: 12px; }
  .turn-banner { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.2rem; }
  .turn-photo { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; }
  
  #board-container { width: 100%; background: var(--card); border-radius: 12px; padding: 10px; height: 60vh; overflow-y: auto; }
  .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; align-items: center; position: relative; min-height: 90px; justify-content: flex-start; }
  .tile.highlight { border: 2px solid #38bdf8; box-shadow: 0 0 8px #38bdf8; }
  .tile-icon { font-size: 1.6rem; margin-top: 8px; }
  .tile-name { font-size: 0.7rem; font-weight: bold; text-align: center; margin-top: 6px; line-height: 1.2; }
  .tile-num { position: absolute; top: 4px; left: 4px; font-size: 0.6rem; color: #64748b; font-weight: bold; }
  .tokens { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; width: 100%; margin-top: auto; min-height: 20px; }
  .mini-photo { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 1px solid white; }

  /* Dado y Modal */
  .dice-box { background: var(--card); padding: 16px; border-radius: 12px; width: 100%; display: flex; gap: 16px; align-items: center; }
  .dice { font-size: 2.5rem; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 12px; border: 2px solid var(--border); }
  
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .modal-box { background: var(--card); border: 3px solid var(--accent); border-radius: 16px; padding: 24px; text-align: center; width: 100%; max-width: 350px; }
  .modal-box h2 { color: #38bdf8; margin-bottom: 12px; font-size: 1.5rem; }
  .modal-box p { font-size: 1.1rem; margin-bottom: 24px; line-height: 1.4; }
</style>
</head>

    { name: "Silencio", icon: "🤐", action: function(p) { return {t: "Voto de Silencio", d: p.name + " no puede hablar hasta su próximo turno. Por cada palabra que diga, bebe 1 trago."}; } },
    { name: "Historia", icon: "📖", action: function(p) { return {t: "Había una vez...", d: p.name + " dice una palabra. El siguiente repite y añade otra, y así sucesivamente. Quien se equivoque bebe 3."}; } },
    { name: "Bebe 4", icon: "🍻", action: function(p) { return {t: "Sed extrema", d: p.name + " bebe 4 tragos."}; } },
    { name: "Sin manos", icon: "🦖", action: function(p) { return {t: "T-Rex", d: p.name + " debe beber su próximo trago sin usar las manos (que le ayude alguien o lo coja con la boca)."}; } },
    { name: "Cascada Invertida", icon: "🌪️", action: function(p) { return {t: "Cascada Inversa", d: p.name + " empieza a beber y el resto le sigue, pero hacia la izquierda (en contra de las agujas del reloj)."}; } },
    { name: "Sprint Final", icon: "🏃", action: function(p) { p.pos = Math.max(0, p.pos - 5); return {t: "Pájaras en el sprint", d: "¡Te has cansado! " + p.name + " retrocede 5 casillas."}; } },
    { name: "Meta", icon: "🏆", action: function(p) { return {t: "¡Victoria Absoluta!", d: "¡" + p.name + " ha destrozado el tablero! Todos los demás se acaban su copa."}; } }
  ];

  // SELECCIONAR JUGADORES
  function togglePlayer(id, name, photoPath) {
    var card = document.getElementById('card-' + id);
    if (selectedPlayers[id]) {
      delete selectedPlayers[id];
      card.className = "avatar-card";
    } else {
      selectedPlayers[id] = { id: id, name: name, photo: photoPath, pos: 0 };
      card.className = "avatar-card selected";
    }
    
    var count = Object.keys(selectedPlayers).length;
    document.getElementById('player-count').innerText = "Jugadores: " + count;
    document.getElementById('start-btn').disabled = (count < 2);
  }

  // INICIAR JUEGO
  function startGame() {
    activePlayers = Object.values(selectedPlayers);
    document.getElementById('setup-screen').className = "screen hidden";
    document.getElementById('game-screen').className = "screen";
    
    var boardHtml = "";
    for (var i = 0; i < TILES.length; i++) {
      boardHtml += "<div class='tile' id='tile-"+i+"'>" +
                   "<span class='tile-num'>"+(i+1)+"</span>" +
                   "<div class='tile-icon'>" + TILES[i].icon + "</div>" +
                   "<div class='tile-name'>" + TILES[i].name + "</div>" +
                   "<div class='tokens' id='tokens-"+i+"'></div>" +
                   "</div>";
    }
    document.getElementById('board-grid').innerHTML = boardHtml;
    updateUI();
  }

  // ACTUALIZAR POSICIONES Y TURNO
  function updateUI() {
    var p = activePlayers[currentTurn];
    
    var turnPhotoEl = document.getElementById('turn-photo');
    turnPhotoEl.src = p.photo;
    // Fallback por si la foto falla
    turnPhotoEl.onerror = function() { this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23f43f5e\'%3E%3Cpath d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/%3E%3C/svg%3E'; };
    
    document.getElementById('turn-name').innerText = p.name;

    for (var i = 0; i < TILES.length; i++) {
      document.getElementById('tokens-'+i).innerHTML = "";
      document.getElementById('tile-'+i).className = "tile";
    }

    for (var j = 0; j < activePlayers.length; j++) {
      var player = activePlayers[j];
      var img = document.createElement("img");
      img.className = "mini-photo";
      img.src = player.photo;
      img.onerror = function() { this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23ffffff\'%3E%3Ccircle cx=\'12\' cy=\'12\' r=\'12\'/%3E%3C/svg%3E'; };
      document.getElementById('tokens-' + player.pos).appendChild(img);
    }
    document.getElementById('tile-' + p.pos).className = "tile highlight";
  }

  // TIRAR DADO
  function rollDice() {
    document.getElementById('roll-btn').disabled = true;
    var display = document.getElementById('dice-display');
    var rolls = 0;
    
    var interval = setInterval(function() {
      display.innerText = Math.floor(Math.random() * 6) + 1;
      rolls++;
      if (rolls > 8) {
        clearInterval(interval);
        var result = Math.floor(Math.random() * 6) + 1;
        display.innerText = result;
        
        var p = activePlayers[currentTurn];
        p.pos = p.pos + result;
        if (p.pos >= TILES.length - 1) p.pos = TILES.length - 1;
        
        updateUI();
        document.getElementById('tile-' + p.pos).scrollIntoView({behavior: 'smooth', block: 'center'});
        
        setTimeout(function() {
          var actionData = TILES[p.pos].action(p);
          document.getElementById('modal-title').innerText = actionData.t;
          document.getElementById('modal-desc').innerText = actionData.d;
          document.getElementById('modal').className = "modal-overlay";
        }, 450);
      }
    }, 60);
  }

  // CERRAR MODAL
  function closeModal() {
    document.getElementById('modal').className = "modal-overlay hidden";
    var p = activePlayers[currentTurn];
    
    updateUI(); // Se actualiza por si la acción (ej: Bug) modificó la posición

    if (p.pos >= TILES.length - 1) {
      alert("🎉 ¡" + p.name + " HA GANADO LA PARTIDA!");
      return;
    }
    currentTurn++;
    if (currentTurn >= activePlayers.length) currentTurn = 0;
    
    document.getElementById('dice-display').innerText = "🎲";
    document.getElementById('roll-btn').disabled = false;
    updateUI();
  }
</script>
</body>
</html>
